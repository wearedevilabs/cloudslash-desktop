name: Release

# Releases build themselves.
#
#   push to main        -> builds everything, publishes/updates the "latest" release
#   push a v* tag       -> builds everything, publishes a release for that tag
#   manual run          -> same as a push to main
#
# The desktop app uses CGO, so it is built on native runners (it cannot be
# cross-compiled). macOS gets a universal arm64 + x86_64 binary.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(cat VERSION)"
          fi
          echo "version: ${version}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "${os}" = "windows" ] && ext=".exe"
            echo "  building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath \
                -ldflags "-s -w -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
                -o "dist/cloudslash_${os}_${arch}${ext}" ./cmd/cloudslash-cli
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            gui_ldflags: ""
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            gui_ldflags: "-H=windowsgui"
          - name: darwin-universal
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            gui_ldflags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Put mingw on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build desktop
        if: runner.os != 'macOS'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w ${{ matrix.gui_ldflags }}" \
            -o "dist/cloudslash-desktop_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/cloudslash-desktop

      - name: Build desktop (universal)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" \
            -o dist/.desktop-arm64 ./cmd/cloudslash-desktop
          GOARCH=amd64 CGO_ENABLED=1 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" \
            -o dist/.desktop-amd64 ./cmd/cloudslash-desktop
          lipo -create -output dist/cloudslash-desktop_darwin_universal \
            dist/.desktop-arm64 dist/.desktop-amd64
          rm -f dist/.desktop-arm64 dist/.desktop-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      # gh needs a checkout (or GH_REPO) to know which repo it is operating on.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum cloudslash* > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag"
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          else
            # Rolling build for main: a prerelease so it never steals the
            # "Latest" badge from a versioned tag.
            tag="latest"
            notes="Built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "Latest build" --notes "$notes"
            else
              gh release create "$tag" --title "Latest build" --prerelease \
                --target "$GITHUB_SHA" --notes "$notes"
            fi
          fi
          gh release upload "$tag" dist/* --clobber
          echo "published: $(gh release view "$tag" --json url --jq .url)"
