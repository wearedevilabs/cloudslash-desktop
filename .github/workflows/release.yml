name: Release

# Releases build themselves.
#
#   push to main        -> builds everything, updates the "latest" prerelease
#   push a v* tag       -> builds everything, publishes a release for that tag
#   manual run          -> same as a push to main
#
# Every download is an archive. A bare Mach-O or ELF file loses its executable
# bit in a browser download, and macOS will then open it as a document instead
# of running it.
#
# The desktop app uses CGO, so it is built on native runners; it cannot be
# cross-compiled. As part of the Linux build the GUI is launched under Xvfb, so
# a release cannot be published with a desktop binary that fails to start.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: cli ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      # One runner per target: Go's build cache is per platform, so building
      # them in sequence means compiling the whole dependency tree five times.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(cat VERSION)"
          fi
          echo "version: ${version}"

          mkdir -p dist
          name="cloudslash_${{ matrix.goos }}_${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi

          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
              -ldflags "-s -w -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
              -o "dist/${name}${ext}" ./cmd/cloudslash-cli

          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Git Bash has no zip on the Windows runners; use PowerShell's.
            pwsh -Command "Compress-Archive -Path 'dist/${name}${ext}' -DestinationPath 'dist/${name}.zip'"
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}${ext}"
          fi
          rm -f "dist/${name}${ext}"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            kind: linux
          - name: windows-amd64
            os: windows-latest
            kind: windows
          - name: darwin-universal
            os: macos-14
            kind: macos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gtk4 + webkitgtk headers for the desktop shell
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgl1-mesa-dev xorg-dev xvfb libgl1-mesa-dri

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/cloudslash-desktop/frontend/package-lock.json

      # the binary embeds the bundle, so build it first
      - name: Bundle the interface
        shell: bash
        env:
          VITE_REVENUECAT_WEB_API_KEY: ${{ secrets.VITE_REVENUECAT_WEB_API_KEY }}
        run: |
          cd cmd/cloudslash-desktop/frontend
          npm ci --include=dev
          npm run build

      - name: Put mingw on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------- linux
      - name: Build (Linux)
        if: matrix.kind == 'linux'
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(cat VERSION)"
          go build -trimpath -tags production \
            -ldflags "-s -w -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
            -o dist/cloudslash-desktop ./cmd/cloudslash-desktop

      - name: Smoke test the GUI (Linux)
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 &
          xvfb_pid=$!
          sleep 3
          # no gpu on a runner
          DISPLAY=:99 \
          GSK_RENDERER=cairo \
          LIBGL_ALWAYS_SOFTWARE=1 \
          WEBKIT_DISABLE_COMPOSITING_MODE=1 \
          WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            ./dist/cloudslash-desktop >/tmp/gui.log 2>&1 &
          app_pid=$!
          sleep 20
          if kill -0 "$app_pid" 2>/dev/null; then
            echo "GUI started and stayed up"
            kill "$app_pid" || true
          else
            echo "GUI exited during startup:"
            cat /tmp/gui.log
            kill "$xvfb_pid" || true
            exit 1
          fi
          echo "--- app log ---"
          cat /tmp/gui.log || true
          kill "$xvfb_pid" || true

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail
          cp cmd/cloudslash-desktop/assets/appicon.png dist/cloudslash.png
          cp cmd/cloudslash-desktop/assets/cloudslash.desktop dist/cloudslash.desktop
          tar -czf dist/cloudslash-desktop_linux_amd64.tar.gz -C dist \
            cloudslash-desktop cloudslash.png cloudslash.desktop
          rm -f dist/cloudslash-desktop dist/cloudslash.png dist/cloudslash.desktop
          ls -lh dist

      # -------------------------------------------------------------- windows
      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(cat VERSION)"
          go build -trimpath -tags production \
            -ldflags "-s -w -H=windowsgui -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
            -o dist/cloudslash-desktop.exe ./cmd/cloudslash-desktop

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          Copy-Item cmd/cloudslash-desktop/assets/appicon.ico dist/cloudslash.ico
          Compress-Archive -Path dist/cloudslash-desktop.exe, dist/cloudslash.ico `
            -DestinationPath dist/cloudslash-desktop_windows_amd64.zip
          Remove-Item dist/cloudslash-desktop.exe, dist/cloudslash.ico
          Get-ChildItem dist

      # ---------------------------------------------------------------- macOS
      - name: Build and package (macOS)
        if: matrix.kind == 'macos'
        shell: bash
        env:
          # must match LSMinimumSystemVersion in the plist
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist
          GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -tags production \
            -ldflags "-s -w -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
            -o dist/.desktop-arm64 ./cmd/cloudslash-desktop
          GOARCH=amd64 CGO_ENABLED=1 CC="clang -arch x86_64" go build -trimpath -tags production \
            -ldflags "-s -w -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
            -o dist/.desktop-amd64 ./cmd/cloudslash-desktop
          lipo -create -output dist/.desktop-universal dist/.desktop-arm64 dist/.desktop-amd64
          rm -f dist/.desktop-arm64 dist/.desktop-amd64

          app="dist/CloudSlash.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          mv dist/.desktop-universal "${app}/Contents/MacOS/cloudslash-desktop"
          chmod +x "${app}/Contents/MacOS/cloudslash-desktop"
          iconutil -c icns cmd/cloudslash-desktop/assets/appicon.iconset -o "${app}/Contents/Resources/AppIcon.icns"

          cat <<PLIST | sed 's/^[[:space:]]*//' > "${app}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CloudSlash</string>
            <key>CFBundleDisplayName</key><string>CloudSlash</string>
            <key>CFBundleExecutable</key><string>cloudslash-desktop</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>io.cloudslash.desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>15.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          echo "--- bundle checks ---"
          plutil -lint "${app}/Contents/Info.plist"
          file "${app}/Contents/MacOS/cloudslash-desktop"
          file "${app}/Contents/MacOS/cloudslash-desktop" | grep -q "universal binary"
          codesign --force --deep --sign - "${app}"
          codesign --verify --verbose "${app}"

          (cd dist && zip -qry cloudslash-desktop_darwin_universal.app.zip CloudSlash.app)
          rm -rf "${app}"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      # gh needs a checkout (or GH_REPO) to know which repo it operates on.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum cloudslash* > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag"
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          else
            # Rolling build for main: a prerelease so it never steals the
            # "Latest" badge from a versioned tag.
            tag="latest"
            notes="Built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "Latest build" --notes "$notes"
            else
              gh release create "$tag" --title "Latest build" --prerelease \
                --target "$GITHUB_SHA" --notes "$notes"
            fi
          fi

          # Drop assets that are no longer produced by this build, so nobody
          # can download a stale (or non-runnable) binary from an older run.
          for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
            if [ ! -e "dist/${asset}" ]; then
              echo "removing stale asset: ${asset}"
              gh release delete-asset "$tag" "$asset" --yes
            fi
          done

          gh release upload "$tag" dist/* --clobber
          echo "published: $(gh release view "$tag" --json url --jq .url)"
