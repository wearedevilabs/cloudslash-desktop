name: Release

# Cutting a release:
#   git tag v2.2.7 && git push origin v2.2.7
#
# On a v* tag this workflow:
#   1. verifies the tree (gofmt, vet, tests)
#   2. publishes the CLI archives + checksums with GoReleaser
#   3. builds the desktop app on native runners and attaches it to that release
#
# Running it manually (Actions -> Release -> Run workflow) only builds the
# desktop artifacts and does not touch any release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd pkg)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        # Hermetic package tests. Integration tests that need AWS or Docker
        # skip themselves when those are unavailable.
        run: go test ./pkg/...

  cli-release:
    name: goreleaser
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: desktop ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            gui_ldflags: ""
          - name: windows/amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            gui_ldflags: "-H=windowsgui"
          - name: darwin/universal
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            gui_ldflags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Put mingw on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build desktop
        if: runner.os != 'macOS'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w ${{ matrix.gui_ldflags }}" \
            -o "dist/cloudslash-desktop_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/cloudslash-desktop

      - name: Build desktop (universal)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" \
            -o dist/.desktop-arm64 ./cmd/cloudslash-desktop
          GOARCH=amd64 CGO_ENABLED=1 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" \
            -o dist/.desktop-amd64 ./cmd/cloudslash-desktop
          lipo -create -output dist/cloudslash-desktop_darwin_universal \
            dist/.desktop-arm64 dist/.desktop-amd64
          rm -f dist/.desktop-arm64 dist/.desktop-amd64

      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum cloudslash-desktop_* > "SHA256SUMS-desktop-${{ matrix.goos }}-${{ matrix.goarch }}"
          else
            shasum -a 256 cloudslash-desktop_* > "SHA256SUMS-desktop-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  attach-desktop:
    name: attach desktop builds
    needs: [cli-release, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release GoReleaser created
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
