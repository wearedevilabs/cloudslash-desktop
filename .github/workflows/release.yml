name: Release

# Releases build themselves.
#
#   push to main        -> builds everything, updates the "latest" prerelease
#   push a v* tag       -> builds everything, publishes a release for that tag
#   manual run          -> same as a push to main
#
# Everything is published as an archive (.tar.gz / .zip). A bare Mach-O or ELF
# file loses its executable bit in a browser download, and macOS will then open
# it as a document instead of running it. Archives keep the bit, and the macOS
# build ships as a real .app bundle.
#
# The desktop app uses CGO, so it is built on native runners; it cannot be
# cross-compiled. macOS gets a universal arm64 + x86_64 binary.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: cli ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      # One runner per target: Go's build cache is per platform, so building
      # them in sequence means compiling the whole dependency tree five times.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(cat VERSION)"
          fi
          echo "version: ${version}"

          mkdir -p dist
          name="cloudslash_${{ matrix.goos }}_${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi

          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath \
              -ldflags "-s -w -X github.com/DrSkyle/cloudslash/v2/pkg/version.Current=${version}" \
              -o "dist/${name}${ext}" ./cmd/cloudslash-cli

          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -q "${name}.zip" "${name}${ext}")
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}${ext}"
          fi
          rm -f "dist/${name}${ext}"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            kind: linux
          - name: windows-amd64
            os: windows-latest
            kind: windows
          - name: darwin-universal
            os: macos-latest
            kind: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Put mingw on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build and package (Linux)
        if: matrix.kind == 'linux'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/cloudslash-desktop ./cmd/cloudslash-desktop
          tar -czf dist/cloudslash-desktop_linux_amd64.tar.gz -C dist cloudslash-desktop
          rm -f dist/cloudslash-desktop
          ls -lh dist

      - name: Build and package (Windows)
        if: matrix.kind == 'windows'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui" \
            -o dist/cloudslash-desktop.exe ./cmd/cloudslash-desktop
          (cd dist && zip -q cloudslash-desktop_windows_amd64.zip cloudslash-desktop.exe)
          rm -f dist/cloudslash-desktop.exe
          ls -lh dist

      - name: Build and package (macOS .app)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist
          GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" \
            -o dist/.desktop-arm64 ./cmd/cloudslash-desktop
          GOARCH=amd64 CGO_ENABLED=1 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" \
            -o dist/.desktop-amd64 ./cmd/cloudslash-desktop
          lipo -create -output dist/.desktop-universal dist/.desktop-arm64 dist/.desktop-amd64
          rm -f dist/.desktop-arm64 dist/.desktop-amd64

          app="dist/CloudSlash.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          mv dist/.desktop-universal "${app}/Contents/MacOS/cloudslash-desktop"
          chmod +x "${app}/Contents/MacOS/cloudslash-desktop"

          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CloudSlash</string>
            <key>CFBundleDisplayName</key><string>CloudSlash</string>
            <key>CFBundleExecutable</key><string>cloudslash-desktop</string>
            <key>CFBundleIdentifier</key><string>io.cloudslash.desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "${app}" 2>/dev/null || echo "ad-hoc signing skipped"
          (cd dist && zip -qry cloudslash-desktop_darwin_universal.app.zip CloudSlash.app)
          rm -rf "${app}"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      # gh needs a checkout (or GH_REPO) to know which repo it operates on.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum cloudslash* > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag"
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          else
            # Rolling build for main: a prerelease so it never steals the
            # "Latest" badge from a versioned tag.
            tag="latest"
            notes="Built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "Latest build" --notes "$notes"
            else
              gh release create "$tag" --title "Latest build" --prerelease \
                --target "$GITHUB_SHA" --notes "$notes"
            fi
          fi
          gh release upload "$tag" dist/* --clobber
          echo "published: $(gh release view "$tag" --json url --jq .url)"
